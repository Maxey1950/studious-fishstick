<!-- ===================================================================
     GOOGLE SITES EMBED TEST

     What it checks: whether a Google Sites "Embed code" block is allowed
     to load the MakeCode Arcade editor in a nested iframe, and whether it
     can talk to it. If it can, the whole collaboration app can live on
     Google Sites using only domains your school already allows.

     HOW TO RUN
       1. sites.google.com -> Create a new site (blank)
       2. Right panel: Insert -> Embed -> "Embed code" tab
       3. Paste EVERYTHING below, click Next, then Insert
       4. Publish the site, then open the published page
       5. Read the status box. Report what it says.

     Do it on the school Chromebook, on the published page (not the editor
     preview) -- previews behave differently from the real thing.
     =================================================================== -->

<div style="font:14px system-ui,sans-serif">
  <div id="status" style="padding:.6rem;border:2px solid #888;border-radius:6px;margin-bottom:.5rem">
    <b>Status:</b> <span id="msg">starting…</span>
  </div>
  <div id="log" style="font:12px ui-monospace,monospace;white-space:pre-wrap;
       max-height:9rem;overflow:auto;background:#f4f4f4;padding:.5rem;border-radius:6px"></div>
  <iframe id="mc" style="width:100%;height:520px;border:1px solid #ccc;margin-top:.5rem"
          src="https://arcade.makecode.com/?controller=1&ws=browser&nocookiebanner=1"></iframe>
</div>

<script>
(function () {
  var msg = document.getElementById('msg');
  var log = document.getElementById('log');
  var box = document.getElementById('status');
  var sawLoad = false, sawMessage = false;

  function say(text) {
    log.textContent += new Date().toISOString().slice(11, 19) + '  ' + text + '\n';
    log.scrollTop = log.scrollHeight;
  }
  function verdict(text, good) {
    msg.textContent = text;
    box.style.borderColor = good ? '#137333' : '#c5221f';
    box.style.background = good ? '#e6f4ea' : '#fce8e6';
  }

  say('embed is running (so Google Sites allows scripts)');

  document.getElementById('mc').addEventListener('load', function () {
    sawLoad = true;
    say('iframe fired load — nested iframe is NOT blocked');
  });

  // The editor announces itself; receiving anything proves two-way capability.
  window.addEventListener('message', function (event) {
    var data = event.data;
    if (!data || typeof data !== 'object') return;
    if (String(data.type || '').indexOf('pxt') !== 0) return;
    if (!sawMessage) {
      sawMessage = true;
      say('FIRST MESSAGE FROM EDITOR: action=' + (data.action || '(none)'));
      verdict('WORKS — the editor loaded and is talking to the page.', true);
    }
  });

  setTimeout(function () {
    if (sawMessage) return;
    if (sawLoad) {
      verdict('PARTIAL — editor frame loaded but sent no messages.', false);
      say('the sandbox may be stripping postMessage, or the editor needs longer');
    } else {
      verdict('BLOCKED — the editor iframe never loaded.', false);
      say('Google Sites is not allowing the nested iframe, or makecode is blocked here');
    }
  }, 40000);
})();
</script>
