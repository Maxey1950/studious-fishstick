# ViaProxy config placeholder.
#
# STRUCTURAL SKELETON ONLY — copy the real key names from the sample
# `viaproxy.yml` shipped in the ViaProxy release
# (https://github.com/ViaVersion/ViaProxy/releases) before this is used.
# Do not deploy this file as-is.

bind-address: "0.0.0.0"
bind-port: 25568

# The real, offline-mode Java server.
target-address: "REPLACE_WITH_TARGET_SERVER_HOST:25565"
target-version: "AUTO_DETECT"

# Client-facing protocol: the Eaglercraft client's native version.
# Client source unavailable — set to EaglercraftX 26.1.2's confirmed
# protocol (775) as a working assumption, not a verified fact.
# If handshake fails, check this first — see docs/ARCHITECTURE.md §5 item 1.
# Confirm against ViaProxy's actual accepted value format (protocol integer
# vs version string like "1.21.11"/"26.1.2") in its current sample config.
client-version: "775"

# The target server is offline-mode ("cracked"); ViaProxy must pass through
# the same offline UUID rather than attempting Microsoft account auth.
# Verify the exact setting name against ViaProxy's current sample config —
# this has been named differently across releases.
auth-method: "PASSTHROUGH_OFFLINE"
