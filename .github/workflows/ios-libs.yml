name: iOS native libraries (arm64) + XCFramework
on:
  workflow_dispatch:
  push:
    paths: ["scripts/ios/**", "third_party/versions.env", ".github/workflows/ios-libs.yml"]
jobs:
  libs:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: brew install autoconf automake libtool pkg-config
      - uses: actions/cache@v4
        with:
          path: third_party/out
          key: ios-libs-${{ hashFiles('third_party/versions.env', 'scripts/ios/**') }}
      - name: Build device slice
        run: test -f third_party/out/device/libIDeviceKitNative.a || scripts/ios/build-deps.sh device
      - name: Build simulator slice
        run: test -f third_party/out/simulator/libIDeviceKitNative.a || scripts/ios/build-deps.sh simulator
      - name: XCFramework
        run: scripts/ios/make-xcframework.sh
      - name: Show licenses/versions
        run: cat third_party/versions.env
      - uses: actions/upload-artifact@v4
        with: { name: IDeviceKitNative-xcframework, path: third_party/out/IDeviceKitNative.xcframework }
