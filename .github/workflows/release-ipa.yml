name: Device archive + IPA
on:
  workflow_dispatch:
    inputs:
      bundle_id:
        description: "Bundle ID (must match your provisioning profile when signing)"
        default: "dev.ideviceKit.app"
env:
  BUNDLE_ID: ${{ inputs.bundle_id }}
jobs:
  device:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen && xcodegen generate
      - name: Detect signing secrets
        id: sign
        env:
          P12: ${{ secrets.IOS_CERT_P12_BASE64 }}
          PROFILE: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
        run: |
          if [ -n "$P12" ] && [ -n "$PROFILE" ]; then echo "enabled=true" >> "$GITHUB_OUTPUT"; else echo "enabled=false" >> "$GITHUB_OUTPUT"; fi
      # ---------- Unsigned path: device-slice .app packaged as an UNSIGNED ipa ----------
      - name: Build unsigned device app
        if: steps.sign.outputs.enabled != 'true'
        run: |
          set -o pipefail
          xcodebuild build -project iDeviceKit.xcodeproj -scheme iDeviceKit -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build/DD \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" | tail -n 40
          APP=build/DD/Build/Products/Release-iphoneos/iDeviceKit.app
          scripts/ci/verify-binary.sh "$APP" device
          mkdir -p artifacts/Payload && cp -R "$APP" artifacts/Payload/
          (cd artifacts && zip -qry iDeviceKit-unsigned.ipa Payload && rm -rf Payload)
      # ---------- Signed path (Personal Team or paid team) ----------
      - name: Import certificate + profile
        if: steps.sign.outputs.enabled == 'true'
        env:
          P12: ${{ secrets.IOS_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_CERT_PASSWORD }}
          PROFILE: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
        run: |
          KC="$RUNNER_TEMP/build.keychain-db"; KP="$(uuidgen)"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          echo "$PROFILE" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
          security create-keychain -p "$KP" "$KC"
          security set-keychain-settings -lut 3600 "$KC"
          security unlock-keychain -p "$KP" "$KC"
          security import "$RUNNER_TEMP/cert.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KC"
          security set-key-partition-list -S apple-tool:,apple: -k "$KP" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" login.keychain
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/profile.plist")
          NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/profile.plist")
          TEAM=$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$RUNNER_TEMP/profile.plist")
          cp "$RUNNER_TEMP/profile.mobileprovision" ~/Library/MobileDevice/Provisioning\ Profiles/$UUID.mobileprovision
          EXP=$(/usr/libexec/PlistBuddy -c 'Print :ExpirationDate' "$RUNNER_TEMP/profile.plist")
          echo "Profile '$NAME' expires: $EXP"
          echo "PROFILE_NAME=$NAME" >> "$GITHUB_ENV"; echo "TEAM_ID=$TEAM" >> "$GITHUB_ENV"
      - name: Archive + export signed IPA
        if: steps.sign.outputs.enabled == 'true'
        run: |
          set -o pipefail
          xcodebuild archive -project iDeviceKit.xcodeproj -scheme iDeviceKit -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/iDeviceKit.xcarchive \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$TEAM_ID" PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" CODE_SIGN_IDENTITY="Apple Development" | tail -n 40
          cat > build/ExportOptions.plist <<PL
          <?xml version="1.0" encoding="UTF-8"?>
          <plist version="1.0"><dict>
            <key>method</key><string>development</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key><dict><key>$BUNDLE_ID</key><string>$PROFILE_NAME</string></dict>
          </dict></plist>
          PL
          xcodebuild -exportArchive -archivePath build/iDeviceKit.xcarchive -exportPath build/export -exportOptionsPlist build/ExportOptions.plist
          mkdir -p artifacts && cp build/export/*.ipa artifacts/iDeviceKit-signed.ipa
          unzip -p artifacts/iDeviceKit-signed.ipa 'Payload/*.app/Info.plist' >/dev/null
      - name: Cleanup keychain
        if: always() && steps.sign.outputs.enabled == 'true'
        run: security delete-keychain "$RUNNER_TEMP/build.keychain-db" || true; rm -f "$RUNNER_TEMP"/cert.p12 "$RUNNER_TEMP"/profile.*
      - uses: actions/upload-artifact@v4
        with: { name: ipa, path: "artifacts/*.ipa" }
