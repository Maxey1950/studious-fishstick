# Netlify deploy config for the Arcade collaboration app.
#
# The site is plain static files plus one function; there is no build step to
# run on Netlify, because `npm run collab:build` produces `web/app.js` locally
# and it is committed.

[build]
  publish = "web"
  functions = "netlify/functions"
  command = ""

[[headers]]
  for = "/*"
  [headers.values]
    # The page embeds the real MakeCode Arcade editor in an iframe.
    Content-Security-Policy = "frame-src https://arcade.makecode.com https://*.makecode.com; default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'; img-src 'self' data:"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
